[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pageparse"
version = "0.1.0"
description = "Terminal workspace for local document parsing and chat"
requires-python = ">=3.12"
dependencies = ["textual>=8.2,<9", "httpx>=0.27", "pymupdf>=1.24,<2", "pillow>=10", "numpy>=1.26", "beautifulsoup4>=4.12", "markdown-it-py>=2.1"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["pageparse*"]

[project.scripts]
pageparse = "pageparse.__main__:main"

[tool.setuptools.package-data]
pageparse = ["*.tcss"]
